<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B2B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex, nofollow">
<title>IMMANUEL FMS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232B2B2E'/%3E%3Ctext x='32' y='42' font-size='28' font-weight='700' text-anchor='middle' fill='%23E8A317' font-family='sans-serif'%3EF%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #F7F6F3; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #ld { position: fixed; inset: 0; display: grid; place-items: center; color: #6F6F73; font: 15px 'Noto Sans KR','Malgun Gothic',sans-serif; }
</style>
</head>
<body>
<div id="ld">IMMANUEL FMS 여는 중…</div>
<!-- 액자: 실제 화면은 Apps Script 웹앱. 이 파일은 주소를 짧게 하고 구글 안내 띠를 숨기는 역할만 함 -->
<iframe id="app" src="https://script.google.com/macros/s/AKfycby20qLAJisW4a0_qEDj70klX-wl5YpcmeKKd2v3kx9XqvYEdxxvz4yVcriK-QMvU9B_Fw/exec?w=1" allow="clipboard-write" onload="var l=document.getElementById('ld');if(l)l.remove()"></iframe>
<script>
  // 앱(iframe 안)이 "이 주소로 가 달라"고 보내면 iframe 주소를 바꿈 (구글 샌드박스 안에서는 스스로 못 옮김)
  var BASE = 'https://script.google.com/macros/s/AKfycby20qLAJisW4a0_qEDj70klX-wl5YpcmeKKd2v3kx9XqvYEdxxvz4yVcriK-QMvU9B_Fw/exec';
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.fms !== 'nav' || typeof d.url !== 'string') return;
    if (d.url.indexOf(BASE) !== 0) return;                       // 우리 웹앱 주소만 허용
    var u = d.url + (d.url.indexOf('?') >= 0 ? '&' : '?') + 'w=1';
    document.getElementById('app').src = u;
  });
</script>
</body>
</html>

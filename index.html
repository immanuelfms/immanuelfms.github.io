<style>
  html, body { margin: 0; height: 100%; background: #F7F6F3; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #ld { position: fixed; inset: 0; background: #F7F6F3; transition: opacity .25s; z-index: 2; }
  #ld.out { opacity: 0; pointer-events: none; }
  #ld .hero { background: linear-gradient(180deg, #2B2B2E, #232325); border-bottom: 3px solid #E8A317; padding: 44px 16px 36px; text-align: center; color: #E9E4DA; }
  #ld img { height: 64px; display: block; margin: 0 auto 18px; }
  #ld .w { font: 400 30px 'Bodoni Moda', Georgia, 'Times New Roman', serif; letter-spacing: .22em; margin-right: -.22em; }
  #ld .f { font: 400 8px 'Jost', Arial, sans-serif; letter-spacing: .7em; margin: 8px -.7em 0 0; }
  #ld .s { font: 400 10px Arial, sans-serif; letter-spacing: .14em; color: #BDB8AE; margin-top: 22px; }
  #ld .dots { text-align: center; margin-top: 40px; color: #9A968E; font: 15px 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
  #ld .dots i { display: inline-block; width: 7px; height: 7px; margin: 0 4px; border-radius: 50%; background: #E8A317; animation: b 1s infinite ease-in-out; }
  #ld .dots i:nth-child(2) { animation-delay: .15s; } #ld .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  #bar { position: fixed; left: 0; top: 0; height: 3px; width: 0; background: #E8A317; z-index: 3; transition: width 2.5s cubic-bezier(.1,.7,.3,1), opacity .3s; opacity: 0; }
  #bar.on { width: 85%; opacity: 1; }
</style>
